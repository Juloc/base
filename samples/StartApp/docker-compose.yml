# Start App: the app and its PostgreSQL (OPS-01, OPS-02). Start: docker compose up -d --build; the setup code: docker compose logs app
name: startapp

services:
  app:
    build:
      context: ../..
      dockerfile: samples/StartApp/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BASE_DB: "Host=db;Database=app;Username=app;Password=app"
      TZ: Europe/Berlin
    volumes:
      - data:/data
    depends_on:
      - db

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app   # reachable only inside this stack: the database has no port
      TZ: Europe/Berlin
    volumes:
      - db:/var/lib/postgresql

volumes:
  data:
  db:
